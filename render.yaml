services:
  - type: web
    name: shynlideepcleaning
    runtime: static
    repo: https://github.com/miralitys/shynlideepcleaning.git
    branch: main
    buildCommand: node scripts/prepare-onrender-redirect.mjs
    staticPublishPath: ./redirect-origin
    routes:
      - type: rewrite
        source: /*
        destination: https://shynlicom.onrender.com/__deep_redirect/*
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
